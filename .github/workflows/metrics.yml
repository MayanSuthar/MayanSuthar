name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Stats Card ──────────────────────────────────────────────────────────
      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MayanSuthar
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          filename: github-stats.svg
          output_action: commit
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_message: "chore: update github-stats.svg [skip ci]"

      # ── Top Languages Card ───────────────────────────────────────────────────
      - name: Generate top languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MayanSuthar
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          filename: github-langs.svg
          output_action: commit
          committer_token: ${{ secrets.METRICS_TOKEN }}
          committer_message: "chore: update github-langs.svg [skip ci]"
